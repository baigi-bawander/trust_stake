# Compile-and-lint-only CI. Deliberately does not run `cargo test`.
#
# The suite's every test transitively depends on `initialize_config`
# succeeding, which accepts only the one signer hardcoded as
# `constants::INITIAL_ADMIN` -- the real deploy wallet, and per its own
# doc comment likely also the program's upgrade authority. Running the
# suite here would mean that private key living in CI, which is not
# acceptable: beyond the usual CI-secret exposure (fork PRs, compromised
# actions, log leakage), `cargo test`/`cargo check` execute `build.rs`
# from every dependency in the tree with full access to the process
# environment, so a compromised transitive dependency -- not even a
# malicious PR against this repo -- could exfiltrate it. See
# docs/TESTING.md for the full reasoning and what this trades away.
#
# What this job still catches without that key: compile errors in the
# program and in the test harness itself (`cargo check --tests` type-checks
# `tests/common/mod.rs` and all three phase files without executing
# anything in them), clippy regressions, and -- via
# programs/truststake/build.rs -- a `target/deploy/*.so` that is missing or
# older than the source that built it. It proves nothing about behaviour;
# run `anchor build && cargo test` locally before merging, same as
# docs/TESTING.md says to.
name: CI

on:
  push:
  pull_request:

jobs:
  build-check-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact Rust version and the
      # rustfmt/clippy components; rustup reads it automatically on the
      # first `cargo`/`rustup` call below, so the version is never
      # duplicated into this file.
      - name: Show the toolchain rust-toolchain.toml selects
        run: rustup show

      - name: Cache Cargo registry, anchor-cli, and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/anchor
            ~/.cache/solana
            target
          # anchor-cli's pinned version is part of the key so a future
          # version bump invalidates the cache instead of silently
          # reusing a stale binary; Cargo.lock covers everything else.
          key: ${{ runner.os }}-cargo-anchor1.1.2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-anchor1.1.2-

      # anchor-cli 1.1.2 will not compile under this repo's rust-toolchain.toml
      # pin (1.89.0): a transitive dependency of the CLI, cargo-platform
      # 0.3.3, requires rustc 1.91, and every cargo invocation run from a
      # working directory inside this checkout picks up that pin automatically,
      # `cargo install` included. Installing under a separately-fetched
      # `stable` toolchain instead of bumping the pin is deliberate, not a
      # shortcut: anchor-cli is only an orchestrator that shells out to
      # `cargo build-sbf`, which compiles the program itself through the
      # separate sbpf toolchain, so whichever host compiler happened to build
      # the CLI binary has zero effect on the bytes anchor build produces.
      # `stable` rather than a second exact pin (e.g. 1.91) is also
      # deliberate: pinning the install would only move this same failure to
      # whenever some future Anchor dependency wants 1.92, for no
      # corresponding benefit, since the install toolchain doesn't feed into
      # program output either way.
      #
      # Do NOT resolve a future recurrence of this by raising
      # rust-toolchain.toml's 1.89.0 pin instead. That pin is load-bearing:
      # the devnet binary at 3Vc6M8Az9h2GtDmqqhQKURqTKKygNfekQq7PoJris6V2 was
      # compiled under 1.89.0 and its onchain bytes were SHA-256 verified
      # against the local target/deploy/truststake.so built the same way. A
      # different rustc version produces different output, so raising the
      # pin would silently break that byte-for-byte reproducibility against
      # what is actually live on devnet, even though the build would still
      # succeed. If `stable` itself starts failing here again because some
      # future anchor-cli dependency wants a compiler newer than whatever
      # `stable` is at the time, that is expected and self-resolving on the
      # next run, not a reason to touch the pin.
      - name: Install a stable toolchain to build anchor-cli itself
        run: rustup toolchain install stable --profile minimal

      # Pinned to 1.1.2 to match anchor-lang/anchor-spl's exact pin in
      # programs/truststake/Cargo.toml (docs/DESIGN-v2.md, Phase 0): the
      # CLI and the crates it scaffolds against have to move together, or
      # the CLI just warns on every invocation. `cargo install` no-ops if
      # this exact version is already present, which the cache above makes
      # the common case. `cargo +stable` selects the toolchain installed
      # above instead of the repo-pinned one rustup would otherwise pick up
      # from rust-toolchain.toml; see the comment above for why.
      - name: Install anchor-cli 1.1.2
        run: cargo +stable install anchor-cli --version 1.1.2 --locked

      - name: Install the Solana CLI (Agave)
        run: |
          curl -sSfL https://release.anza.xyz/stable/install -o /tmp/solana-install.sh
          sh /tmp/solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # anchor's provider config expects a wallet file to exist even to
      # build. Throwaway and never used to sign anything: this job runs
      # no transactions, so it never needs to match INITIAL_ADMIN.
      - name: Create a throwaway wallet for anchor's provider config
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -s -o ~/.config/solana/id.json

      # target/ is gitignored, so a fresh checkout has no committed
      # program keypairs and anchor generates fresh ones that do not
      # match declare_id!'s hardcoded program IDs. --ignore-keys skips
      # that mismatch check rather than running `anchor keys sync` (which
      # would rewrite the program IDs). LiteSVM tests read the ID from
      # declare_id! directly and never touch this keypair file, so build
      # correctness here does not depend on it either way.
      - name: anchor build
        run: anchor build --ignore-keys

      - name: cargo check (lib and tests)
        working-directory: programs/truststake
        run: cargo check --tests

      - name: cargo clippy (lib and tests)
        working-directory: programs/truststake
        run: cargo clippy --tests
